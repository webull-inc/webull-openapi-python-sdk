name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install tox
      - run: python -m tox -e py

  protobuf:
    name: Python ${{ matrix.python.version }} / Protobuf ${{ matrix.protobuf-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.14"
            tox: py314
          - version: "3.15"
            tox: py315
        protobuf-version:
          - "6"
          - "7"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}
      - run: python -m pip install tox
      - run: python -m tox -e ${{ matrix.python.tox }}-protobuf${{ matrix.protobuf-version }}
